# https://mise.jdx.dev/configuration.html
[tools]
lefthook = "2.1.6"
node = "24.15.0"
"npm:prettier" = "3.8.3"
"npm:renovate" = "41.173.1"

[tasks.format]
description = "Format files (defaults to all)"
run = "prettier --write"

[tasks."format:check"]
description = "Check formatting (defaults to all)"
run = "prettier --check"

[tasks.validate]
description = "Validate Renovate presets against the schema"
run = "renovate-config-validator --strict"

[hooks]
postinstall = "lefthook install"
