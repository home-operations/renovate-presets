# https://mise.jdx.dev/configuration.html
[tools]
node = "22"
lefthook = "1"
"npm:prettier" = "3"
"npm:renovate" = "41"

[tasks.format]
description = "Format all files"
run = "prettier --write ."

[tasks."format:check"]
description = "Check formatting (CI)"
run = "prettier --check ."

[tasks.validate]
description = "Validate Renovate presets against the schema (CI)"
run = "renovate-config-validator --strict default.json managers/*.json5 overrides/*.json5 versioning/*.json5 .github/renovate.json5"

[tasks."hooks:install"]
description = "Install lefthook git hooks"
run = "lefthook install"
